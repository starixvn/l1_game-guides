include:
    - project: ci/core-cicd
      ref: main
      file: luminet.gitlab-ci.yml

.base_transform_config: &base_transform_config
    script:
        - echo "====== Build NextJS ======"
        - echo $DEPLOY_ENV
        - cp $CONFIG_FILE_PATH/$CONFIG_FILE_NAME.$DEPLOY_ENV.$CONFIG_FILE_EXTENSION ./$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION
        - curl --fail -o https://tolgee.lumigame.com/v2/projects/2/export?ak=$TOLGEE_KEY --output data.zip
        - unzip -o data.zip -d ./public/i18n
        - rm data.zip
    artifacts:
        paths:
            - "././$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION"
            - "././public/i18n/"
        expire_in: 1 day
